name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
  workflow_dispatch:
    inputs:
      task:
        description: "What should Claude do?"
        required: true
        type: string

jobs:
  claude:
    name: Claude (mention)
    if: |
      github.actor == 'codebreaker32' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !startsWith(github.event.comment.body, '/review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false # cancelling strands the tracking comment mid-task
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --model claude-opus-5
            --append-system-prompt "You are working inside a GitHub Actions runner on this repository. Read CLAUDE.md if it exists and follow it. Before claiming a change works, actually run the build and the test suite. If you cannot verify something, say so plainly instead of asserting it. Keep diffs minimal and scoped to what was asked. When you open a PR, write a description that explains the why, not just the what."

  claude-review:
    name: Claude (review on request)
    if: |
      github.event_name == 'issue_comment' &&
      github.actor == 'codebreaker32' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # issue_comment checks out the default branch, not the PR head
        run: gh pr checkout ${{ github.event.issue.number }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            The maintainer asked for a review with this comment:
            ---
            ${{ github.event.comment.body }}
            ---
            If that comment names a specific focus after "/review" (a file, a
            concern, "security only"), scope your review to it. Otherwise do a
            full review as described below.

            1. Run `gh pr diff ${{ github.event.issue.number }}` to see the changes.
            2. Read the surrounding files for any changed function you do not fully
               understand — the diff alone hides most real bugs.
            3. Leave inline comments only on things that matter:
               - correctness bugs, off-by-one, null/undefined, unhandled errors
               - security: injection, authz gaps, secrets in code, unsafe deserialization
               - concurrency and resource leaks
               - breaking changes to public APIs or DB schemas
               - missing tests for genuinely risky logic
            4. Do NOT comment on formatting, naming taste, or anything a linter owns.
            5. Finish with one short summary comment.

            Be specific. Every comment must name the concrete failure case, not a
            vague worry. Silence is better than noise — a reviewer who flags
            everything gets muted.

            You MUST end by posting a comment on the PR, even if the only thing
            you have to say is that it looks fine. Finishing without posting
            anything is a failed review.
          claude_args: |
            --max-turns 25
            --model claude-opus-5

  claude-task:
    name: Claude (manual task)
    if: github.event_name == 'workflow_dispatch' && github.actor == 'codebreaker32'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            Task: ${{ inputs.task }}

            Work on a new branch and open a pull request when done. Run the test
            suite before opening it. If the task is ambiguous or you hit a blocker,
            open the PR as a draft and explain the open question in the description
            rather than guessing.
          claude_args: |
            --max-turns 60
            --model claude-opus-5